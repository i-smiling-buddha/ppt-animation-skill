<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#12253A}
text{font-family:Poppins,sans-serif;font-weight:700}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1236"/><stop offset="1" stop-color="#3A3296"/></linearGradient>
 <linearGradient id="skyDeep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E1C2D"/><stop offset="1" stop-color="#162B36"/></linearGradient>
 <linearGradient id="skyRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#290D1C"/><stop offset="1" stop-color="#5B1F3A"/></linearGradient>
 <radialGradient id="glow"><stop offset="0" stop-color="#FFF8D8"/><stop offset=".35" stop-color="#FFE4AF" stop-opacity=".55"/><stop offset="1" stop-color="#FFE4AF" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowC"><stop offset="0" stop-color="#C8FBFF"/><stop offset=".4" stop-color="#33F5FF" stop-opacity=".45"/><stop offset="1" stop-color="#33F5FF" stop-opacity="0"/></radialGradient>
 <radialGradient id="glowY"><stop offset="0" stop-color="#FFFFE0"/><stop offset=".45" stop-color="#FFFF47" stop-opacity=".8"/><stop offset="1" stop-color="#FFB42D" stop-opacity="0"/></radialGradient>
 <radialGradient id="vign"><stop offset=".55" stop-color="#FF0040" stop-opacity="0"/><stop offset="1" stop-color="#FF0040" stop-opacity=".55"/></radialGradient>
 <linearGradient id="charG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F79BFF"/><stop offset="1" stop-color="#9246F8"/></linearGradient>
 <linearGradient id="brainG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB9D4"/><stop offset="1" stop-color="#F0437E"/></linearGradient>
 <linearGradient id="brainN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9FA8FF"/><stop offset="1" stop-color="#4B3FC0"/></linearGradient>
 <linearGradient id="cellG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FF8FF"/><stop offset="1" stop-color="#0091C4"/></linearGradient>
 <linearGradient id="junkG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C77DFF"/><stop offset="1" stop-color="#5B1A8F"/></linearGradient>
 <linearGradient id="planetG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#83F96F"/><stop offset="1" stop-color="#01A86A"/></linearGradient>
 <linearGradient id="moonG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBEA"/><stop offset="1" stop-color="#FFCE85"/></linearGradient>
 <linearGradient id="segDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#FFB42D"/></linearGradient>
 <linearGradient id="segNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FA8FF"/><stop offset="1" stop-color="#4B3FC0"/></linearGradient>
 <linearGradient id="cloudG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B3EBFF"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFF9A"/><stop offset="1" stop-color="#FFB42D"/></linearGradient>
 <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B9B9D6"/><stop offset="1" stop-color="#5D5D6B"/></linearGradient>
 <linearGradient id="boxG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5759B9"/><stop offset="1" stop-color="#232453"/></linearGradient>
</defs>
<g id="root"></g>
</svg>
<script>
// ---------- helpers ----------
const E={lin:t=>t,out:t=>1-(1-t)**3,in:t=>t**3,inOut:t=>t<.5?4*t**3:1-(-2*t+2)**3/2,
 outBack:t=>{const c=1.7;return 1+(c+1)*(t-1)**3+c*(t-1)**2}};
const cl=v=>Math.min(1,Math.max(0,v));
const k=(t,a,b,e='inOut')=>E[e](cl((t-a)/(b-a)));
const lerp=(a,b,p)=>a+(b-a)*p;
const rng=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const $=id=>document.getElementById(id);
const set=(el,o)=>{for(const a in o)el.setAttribute(a,o[a])};
const tf=(el,x,y,s=1,r=0)=>el.setAttribute('transform',`translate(${x} ${y}) rotate(${r}) scale(${s})`);
const pop=(el,t,a,x,y,d=.55,s0=1)=>{const p=k(t,a,a+d,'outBack');el.setAttribute('opacity',cl(p*2));tf(el,x,y,Math.max(0.001,p*s0));return p};
const mixC=(a,b,p)=>{const h=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));const A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],p)).toString(16).padStart(2,'0')).join('')};

// ---------- reusable art ----------
function starsSVG(id,n,seed,h=1080){const R=rng(seed);let s=`<g id="${id}">`;for(let i=0;i<n;i++){const x=R()*1920,y=R()*h,r=1+R()*2.6;
 if(R()<.12)s+=`<path data-ph="${R()*6.28}" transform="translate(${x} ${y})" d="M0 -12 Q2 -2 12 0 Q2 2 0 12 Q-2 2 -12 0 Q-2 -2 0 -12Z" fill="#FFF8D8"/>`;
 else s+=`<circle data-ph="${R()*6.28}" cx="${x}" cy="${y}" r="${r}" fill="#fff"/>`}return s+'</g>'}
function twinkle(id,t){for(const c of $(id).children)c.setAttribute('opacity',.35+.65*Math.abs(Math.sin(t*1.6+ +c.dataset.ph)))}
// character: blob with eyes. parts: id_b body, id_eo (open eyes group), id_ec (closed eyes), id_m mouth
function charSVG(id,extra=''){return `<g id="${id}"><g id="${id}_b">
 <ellipse cx="0" cy="18" rx="105" ry="22" fill="#000" opacity=".18"/>
 <path d="M-95 0 C-95 -120 95 -120 95 0 C95 20 60 18 0 18 C-60 18 -95 20 -95 0Z" fill="url(#charG)"/>
 <ellipse cx="-45" cy="-70" rx="22" ry="12" fill="#fff" opacity=".35" transform="rotate(-30 -45 -70)"/>
 <ellipse cx="-62" cy="-18" rx="14" ry="8" fill="#FF6FB0" opacity=".5"/><ellipse cx="62" cy="-18" rx="14" ry="8" fill="#FF6FB0" opacity=".5"/>
 <g id="${id}_eo"><g id="${id}_eL" transform="translate(-32 -48)"><ellipse rx="20" ry="24" fill="#fff"/><circle cx="3" cy="3" r="11" fill="#1F004E"/><circle cx="7" cy="-3" r="4" fill="#fff"/></g>
 <g id="${id}_eR" transform="translate(32 -48)"><ellipse rx="20" ry="24" fill="#fff"/><circle cx="3" cy="3" r="11" fill="#1F004E"/><circle cx="7" cy="-3" r="4" fill="#fff"/></g></g>
 <g id="${id}_ec" opacity="0" stroke="#1F004E" stroke-width="6" fill="none" stroke-linecap="round"><path d="M-50 -46 Q-32 -32 -14 -46"/><path d="M14 -46 Q32 -32 50 -46"/></g>
 <ellipse id="${id}_m" cx="0" cy="-16" rx="10" ry="5" fill="#5B0030"/>${extra}</g></g>`}
// state: open (0..1 eyelid), asleep bool, breathe
function charPose(id,t,{x,y,s=1,asleep=false,open=1,blink=true,mouth=5,rot=0}){
 const br=1+0.025*Math.sin(t*2.4);tf($(id),x,y,s,rot);
 $(id+'_b').setAttribute('transform',`scale(${1/br**.5} ${br})`);
 let o=open; if(blink&&!asleep){const ph=(t%3.1);if(ph<.14)o*=Math.abs(ph-.07)/.07}
 $(id+'_eo').setAttribute('opacity',asleep?0:1);$(id+'_ec').setAttribute('opacity',asleep?1:0);
 for(const e of ['_eL','_eR']){const g=$(id+e);const tx=e=='_eL'?-32:32;g.setAttribute('transform',`translate(${tx} -48) scale(1 ${Math.max(.06,o)})`)}
 $(id+'_m').setAttribute('ry',mouth);
}
function zzzSVG(id){return `<g id="${id}">`+[0,1,2].map(i=>`<text id="${id}${i}" font-size="${40+i*14}" fill="#E1F8FF">z</text>`).join('')+'</g>'}
function zzz(id,t,x,y){for(let i=0;i<3;i++){const p=((t*0.45+i/3)%1);const el=$(id+i);set(el,{x:x+p*90+Math.sin(p*6)*14,y:y-p*170,opacity:Math.sin(p*Math.PI)})}}
function brainSVG(id,fill){return `<g id="${id}">
 <rect x="-40" y="150" width="80" height="110" rx="34" fill="${fill}" opacity=".9"/>
 <ellipse cx="-140" cy="-10" rx="210" ry="185" fill="${fill}"/><ellipse cx="140" cy="-10" rx="210" ry="185" fill="${fill}"/>
 <ellipse cx="0" cy="-90" rx="250" ry="150" fill="${fill}"/><ellipse cx="-70" cy="110" rx="200" ry="110" fill="${fill}"/><ellipse cx="80" cy="110" rx="200" ry="110" fill="${fill}"/>
 <g stroke="#000" stroke-opacity=".18" stroke-width="12" fill="none" stroke-linecap="round">
 <path d="M0 -200 C-20 -120 20 -60 0 0 C-20 60 20 120 0 170"/>
 <path d="M-280 -40 C-220 -90 -180 -20 -120 -70 S-60 -150 -40 -110"/><path d="M-260 70 C-200 30 -160 110 -100 60"/>
 <path d="M280 -40 C220 -90 180 -20 120 -70 S60 -150 40 -110"/><path d="M260 70 C200 30 160 110 100 60"/>
 <path d="M-180 -170 C-140 -130 -90 -190 -60 -150"/><path d="M180 -170 C140 -130 90 -190 60 -150"/></g>
 <ellipse cx="-170" cy="-130" rx="60" ry="24" fill="#fff" opacity=".3" transform="rotate(-25 -170 -130)"/></g>`}
function cloudSVG(id,s=1){return `<g id="${id}"><g transform="scale(${s})"><ellipse cx="0" cy="20" rx="210" ry="60" fill="url(#cloudG)"/><circle cx="-90" cy="-10" r="80" fill="url(#cloudG)"/><circle cx="30" cy="-40" r="105" fill="url(#cloudG)"/><circle cx="130" cy="0" r="70" fill="url(#cloudG)"/><ellipse cx="-20" cy="-90" rx="40" ry="16" fill="#fff" opacity=".6"/></g></g>`}
const label=(id,txt,size,fill='#fff',extra='')=>`<text id="${id}" text-anchor="middle" font-size="${size}" fill="${fill}" ${extra}>${txt}</text>`;


const VO=__DUR__;
const LEAD=VO.map((_,i)=>i?0.25:0.5), TAIL=0.45, FADE=0.4, MIN=[3.6,6.4,16.9,5.2,5.6];
const scenes=[];
function scene(id,bg,build,seek,cam=true){scenes.push({id,bg,build,seek,cam})}
const W=1080,H=1920,CX=540;
const mono="style=\"font-family:'DejaVu Sans Mono',monospace\" font-weight='700'";
const star4=(id,fill)=>`<path id="${id}" d="M0 -16 Q3 -3 16 0 Q3 3 0 16 Q-3 3 -16 0 Q-3 -3 0 -16Z" fill="${fill}"/>`;
function pillSVG(id,w,h,fill,txt,size,tfill='#fff',extra=''){return `<g id="${id}"><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="${h/2}" fill="${fill}"/><text text-anchor="middle" y="${size*0.36}" font-size="${size}" fill="${tfill}" ${extra}>${txt}</text></g>`}

// A: the prompt
const PROMPT=['Make a 60-second','explainer video on','why we sleep.'];
scene('a','skyDeep',()=>starsSVG('ast',90,3,1920)+
 `<text id="ah1" x="${CX}" y="330" text-anchor="middle" font-size="104" fill="#fff">I typed ONE</text>`+
 `<text id="ah2" x="${CX}" y="450" text-anchor="middle" font-size="104" fill="#FFFF47" stroke="#FF5F2D" stroke-width="8" paint-order="stroke">sentence...</text>`+
 `<g id="aterm"><rect x="-450" y="-230" width="900" height="460" rx="36" fill="#0E1C2D" stroke="#33F5FF" stroke-width="4"/><rect x="-450" y="-230" width="900" height="70" rx="36" fill="#162B36"/><rect x="-450" y="-190" width="900" height="30" fill="#162B36"/>`+
 `<circle cx="-400" cy="-195" r="12" fill="#FF5F2D"/><circle cx="-362" cy="-195" r="12" fill="#FFE34D"/><circle cx="-324" cy="-195" r="12" fill="#6EED65"/>`+
 `<text x="-400" y="-70" font-size="46" fill="#6EED65" ${mono}>&gt;</text>`+PROMPT.map((l,i)=>`<text id="ap${i}" x="-350" y="${-70+i*80}" font-size="46" fill="#E1F8FF" ${mono}></text>`).join('')+
 `<rect id="acur" width="26" height="50" fill="#33F5FF"/></g>`+charSVG('ac'),
(t,D)=>{twinkle('ast',t);const a=k(t,.1,.6,'outBack');set($('ah1'),{opacity:cl(a*2)});const b=k(t,.35,.85,'outBack');set($('ah2'),{opacity:cl(b*2),transform:`translate(${CX} 450) scale(${Math.max(.001,b)}) translate(${-CX} -450)`});
 pop($('aterm'),t,.2,CX,980,.5);
 const full=PROMPT.join('|');const n=Math.floor(k(t,.7,D-.6,'lin')*full.length);let left=n,lx=0,ly=0;
 PROMPT.forEach((l,i)=>{const c=Math.max(0,Math.min(l.length,left));$('ap'+i).textContent=l.slice(0,c);if(left>0&&c>0){ly=i;lx=c}left-=l.length+1});
 set($('acur'),{x:-350+lx*27.7+4,y:-112+ly*80,opacity:(Math.floor(t*2.5)%2||n<full.length)?1:0});
 charPose('ac',t,{x:CX,y:1560+6*Math.sin(t*2),s:1.7,open:1,mouth:5+6*k(t,D-1,D-.6)});
});
// B: pipeline
const STEPS=[['Research + script','#00A7E2'],['Voiceover (offline)','#E565FF'],['Animated SVG scenes','#FFB42D'],['Render 1080p MP4','#01CB79']];
scene('b','sky',()=>starsSVG('bst',100,5,1920)+
 `<text id="bh1" x="${CX}" y="300" text-anchor="middle" font-size="84" fill="#fff">...and my AI did</text><text id="bh2" x="${CX}" y="400" text-anchor="middle" font-size="84" fill="#FFFF47" stroke="#FF5F2D" stroke-width="7" paint-order="stroke">everything else</text>`+
 STEPS.map(([n,c],i)=>`<g id="b${i}"><rect x="-450" y="-90" width="900" height="180" rx="40" fill="#211840" stroke="${c}" stroke-width="4"/><text x="-400" y="-12" font-size="50" fill="#fff">${n}</text><rect x="-400" y="30" width="700" height="22" rx="11" fill="#000" opacity=".35"/><rect id="bf${i}" x="-400" y="30" height="22" rx="11" fill="${c}"/><g id="bk${i}" transform="translate(370 0)"><circle r="46" fill="${c}"/><path d="M-20 0 L-6 16 L22 -16" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`).join(''),
(t,D)=>{twinkle('bst',t);const a=k(t,.05,.5,'outBack');set($('bh1'),{opacity:cl(a*2)});set($('bh2'),{opacity:cl(k(t,.25,.7)*2)});
 const per=(D-1.2)/4;
 STEPS.forEach((_,i)=>{const s0=.5+i*per;pop($('b'+i),t,s0,CX,640+i*250,.45);const f=k(t,s0+.2,s0+per*.9,'inOut');$('bf'+i).setAttribute('width',700*f);
  const ck=k(t,s0+per*.9,s0+per*.9+.35,'outBack');$('bk'+i).setAttribute('transform',`translate(370 0) scale(${Math.max(.001,ck)})`);$('bk'+i).setAttribute('opacity',cl(ck*2))});
});
// C: the result (video overlaid by ffmpeg at x0 y=656 w=1080 h=608)
scene('c','skyDeep',()=>starsSVG('cst',120,7,1920)+
 `<text id="ch1" x="${CX}" y="330" text-anchor="middle" font-size="96" fill="#fff">This is what</text><text id="ch2" x="${CX}" y="450" text-anchor="middle" font-size="96" fill="#FFFF47" stroke="#FF5F2D" stroke-width="8" paint-order="stroke">it made</text>`+
 `<rect id="cglow" x="-14" y="642" width="1108" height="636" rx="10" fill="none" stroke="#33F5FF" stroke-width="6"/><rect x="0" y="656" width="1080" height="608" fill="#000"/>`+
 pillSVG('cp0',260,100,'#FF197C','82 sec',50)+pillSVG('cp1',300,100,'#00A7E2','11 scenes',50)+pillSVG('cp2',280,100,'#01CB79','1 prompt',50)+
 `<text id="cfoot" x="${CX}" y="1720" text-anchor="middle" font-size="44" fill="#B3EBFF">Hindi narration · made 100% in code</text>`,
(t,D)=>{twinkle('cst',t);set($('ch1'),{opacity:cl(k(t,.1,.5)*2)});const b=k(t,.3,.8,'outBack');set($('ch2'),{opacity:cl(b*2),transform:`translate(${CX} 450) scale(${Math.max(.001,b)}) translate(${-CX} -450)`});
 $('cglow').setAttribute('opacity',.5+.5*Math.abs(Math.sin(t*2)));
 [[195,1.6],[540,2.6],[880,3.6]].forEach(([x,a],i)=>{pop($('cp'+i),t,a,x,1460,.5)});
 set($('cfoot'),{opacity:k(t,4.5,5.2)});
},false);
// D1: checklist
const NO=[['No After Effects','#FF5F2D',false],['No paid APIs','#FF5F2D',false],['Free + open source','#01CB79',true]];
scene('d1','sky',()=>starsSVG('dst',100,9,1920)+NO.map(([n,c,ok],i)=>`<g id="d${i}"><rect x="-450" y="-90" width="900" height="180" rx="40" fill="#211840" stroke="${c}" stroke-width="4"/><g transform="translate(-350 0)"><circle r="56" fill="${c}"/>${ok?'<path d="M-24 0 L-7 19 L26 -19" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>':'<path d="M-20 -20 L20 20 M20 -20 L-20 20" stroke="#fff" stroke-width="12" stroke-linecap="round"/>'}</g><text x="-260" y="20" font-size="58" fill="#fff">${n}</text></g>`).join('')+charSVG('dc'),
(t,D)=>{twinkle('dst',t);NO.forEach((_,i)=>pop($('d'+i),t,.2+i*1.1,CX,520+i*260,.45));charPose('dc',t,{x:CX,y:1580+5*Math.sin(t*2),s:1.6,open:1,mouth:5+10*k(t,2.4,2.8)});});
// D2: CTA
scene('d2','sky',()=>starsSVG('est',150,11,1920)+
 `<g id="emoon"><circle r="230" fill="url(#glow)"/><circle r="90" fill="url(#moonG)"/><circle cx="-26" cy="-18" r="16" fill="#FFCE85" opacity=".6"/></g>`+
 `<text id="et1" x="${CX}" y="520" text-anchor="middle" font-size="112" fill="#fff">PPT Animation</text><text id="et2" x="${CX}" y="650" text-anchor="middle" font-size="112" fill="#FFFF47" stroke="#FF5F2D" stroke-width="9" paint-order="stroke">Skill</text>`+
 `<g id="ecmd"><rect x="-480" y="-120" width="960" height="240" rx="36" fill="#0E1C2D" stroke="#33F5FF" stroke-width="4"/><text x="-430" y="-22" font-size="46" fill="#6EED65" ${mono}>npx skills add</text><text x="-430" y="58" font-size="40" fill="#E1F8FF" ${mono}>i-smiling-buddha/ppt-animation-skill</text></g>`+
 `<text id="ework" x="${CX}" y="1110" text-anchor="middle" font-size="42" fill="#B3EBFF">Claude Code · Codex · Cursor · Gemini CLI</text>`+
 cloudSVG('ecl',1.1)+charSVG('ec')+zzzSVG('ez')+
 `<text id="eby" x="${CX}" y="1820" text-anchor="middle" font-size="40" fill="#E1F8FF">by Smiling Buddha · DESITechnology</text>`,
(t,D)=>{twinkle('est',t);tf($('emoon'),860,230,1+.03*Math.sin(t*2));
 const a=k(t,.1,.6,'outBack');set($('et1'),{opacity:cl(a*2)});const b=k(t,.3,.8,'outBack');set($('et2'),{opacity:cl(b*2),transform:`translate(${CX} 650) scale(${Math.max(.001,b)}) translate(${-CX} -650)`});
 pop($('ecmd'),t,.9,CX,900,.5);set($('ework'),{opacity:k(t,1.5,2)});
 const fl=8*Math.sin(t*1.3);tf($('ecl'),CX,1530+fl,1);charPose('ec',t,{x:CX,y:1460+fl,s:1.15,asleep:true});zzz('ez',t,620,1400+fl);
 set($('eby'),{opacity:k(t,2,2.6)});
});
let tcur=0;scenes.forEach((sc,i)=>{sc.start=tcur;sc.voAt=tcur+LEAD[i];sc.dur=Math.max(MIN[i],LEAD[i]+VO[i]+TAIL);tcur+=sc.dur});
window.DURATION=tcur;window.TIMELINE=scenes.map(s=>({id:s.id,start:s.start,dur:s.dur,voAt:s.voAt}));
const root=$('root');
for(const sc of scenes){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<rect width="1080" height="1920" fill="url(#${sc.bg})"/><g id="${sc.id}_cam">${sc.build()}</g>`;root.appendChild(g);sc.el=g;sc.camEl=g.querySelector('#'+sc.id+'_cam')}
window.seek=T=>{for(let i=0;i<scenes.length;i++){const sc=scenes[i];const lt=T-sc.start;const vis=lt>=-0.0001&&lt<sc.dur+FADE;sc.el.style.display=vis?'':'none';if(!vis)continue;
 sc.el.setAttribute('opacity',i==0?1:k(lt,0,FADE,'inOut'));const z=sc.cam?1+.04*k(lt,0,sc.dur+FADE,'lin'):1;sc.camEl.setAttribute('transform',`translate(540 960) scale(${z}) translate(-540 -960)`);sc.seek(Math.max(0,lt),sc.dur)}};
window.seek(0);
</script></body></html>
